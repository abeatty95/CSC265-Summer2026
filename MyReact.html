<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amanda Beatty - React Page</title>

   
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

   
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background-color: #333;
            color: white;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .react-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .react-card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            width: 280px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .react-card button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #333;
            color: white;
        }

        .react-card button:hover {
            background-color: #555;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 30px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
        }

        /* Responsive design */
        @media (max-width: 600px) {
            header h1 {
                font-size: 24px;
            }

            .react-container {
                flex-direction: column;
                align-items: center;
            }

            .react-card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Amanda Beatty</h1>
        <p>Summer 2026</p>
        <p>React Example</p>
    </header>

    <main>
        <div id="root"></div>

        <a class="home-link" href="index.html">Return to Home Page</a>
    </main>

    <footer>
        <p>Web Development - Summer 2026</p>
    </footer>

    <script type="text/babel">

        function AssignmentCard(props) {

            const [message, setMessage] = React.useState(
                "Click the button to test the React component."
            );

            function handleClick() {
                setMessage("The React component is working!");
            }

            return (
                <section className="react-card">
                    <h2>{props.title}</h2>

                    <p>
                        This card was created using a reusable React component.
                    </p>

                    <p>{message}</p>

                    <button onClick={handleClick}>
                        Test React
                    </button>
                </section>
            );
        }

        function App() {
            return (
                <div className="react-container">

                    <AssignmentCard title="My React Component" />

                    <AssignmentCard title="Reusable Component" />

                </div>
            );
        }

        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(<App />);

    </script>

</body>
</html>
