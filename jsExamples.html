<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Examples</title>

    <link rel="stylesheet" href="index-style.css">

    <script src="jsExamples.js" defer></script>
</head>

<body>

    <header>
        <h1>JavaScript Examples</h1>
        <p>Amanda Beatty</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
    </nav>

    <main>

        <section class="card">
            <h2>Example 1: Greeting</h2>

            <p>Enter your name to receive a greeting.</p>

            <input type="text" id="nameInput" placeholder="Enter your name">

            <button id="greetingButton">Display Greeting</button>

            <p id="greetingOutput"></p>
        </section>

        <section class="card">
            <h2>Example 2: Addition Calculator</h2>

            <p>Enter two numbers to calculate their sum.</p>

            <input type="number" id="firstNumber" placeholder="First number">

            <input type="number" id="secondNumber" placeholder="Second number">

            <button id="addButton">Add Numbers</button>

            <p id="calculatorOutput"></p>
        </section>

        <section class="card">
            <h2>Example 3: Background Color</h2>

            <p>Click a button to change the page background color.</p>

            <button id="blueButton">Light Blue</button>

            <button id="grayButton">Light Gray</button>

            <button id="resetButton">Reset</button>
        </section>

    </main>

    <footer>
    
    </footer>

</body>
</html>
